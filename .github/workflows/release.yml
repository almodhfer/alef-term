# Build the downloads and publish a GitHub Release when a version tag is pushed:
#   git tag v0.1.0 && git push github v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: sh scripts/bundle.sh
      - name: Package
        run: ditto -c -k --keepParent target/bundle/Alef.app "Alef-$GITHUB_REF_NAME-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Alef-*.zip

  linux:
    # An older Ubuntu, so the executable runs on older C libraries too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release && cargo build --release --example icon
      - name: Package
        run: |
          dir="alef-term-$GITHUB_REF_NAME-linux-x86_64"
          mkdir -p "$dir/icons"
          cp target/release/alef-term LICENSE README.md "$dir/"
          cp scripts/install-linux.sh "$dir/install.sh"
          chmod +x "$dir/install.sh"
          for s in 48 128 256 512; do
            ./target/release/examples/icon "$dir/icons/$s.png" $s
          done
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: alef-term-*.tar.gz

  release:
    needs: [test, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Alef-*.zip
            alef-term-*.tar.gz
