[package]
name = "arabic-term"
version = "0.1.0"
edition = "2021"
description = "A terminal emulator that renders Arabic correctly: full bidi + contextual shaping."

[dependencies]
winit = "0.30.13"
rustybuzz = "0.20.1"
swash = "0.2.10"
unicode-bidi = "0.3.18"

unicode-width = "0.2.2"
unicode-normalization = "0.1.25"
vte = "0.15.0"
portable-pty = "0.9.0"
fontdb = "0.24.0"
png = "0.18"
arboard = "3.6.1"
anyhow = "1.0"
bitflags = "2.13"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
pollster = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
memchr = "2.8.3"
softbuffer = "0.4"

[dev-dependencies]
winit = "0.30.13"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"

# The software renderer and text shaper run on every interactive frame. Keep
# `cargo run` responsive too, while retaining debug symbols and assertions.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
